<!doctype html>
<!-- Source of public/og.png, the image chat apps and social sites show for a link to the site.
     Render it at 1200x630, for example:
     google-chrome --headless=new --window-size=1200,630 --hide-scrollbars --screenshot=public/og.png scripts/og.html -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Space+Grotesk:wght@400;500&display=block" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { width: 1200px; height: 630px; padding: 72px 80px; background: #17191a; color: #e8e6df; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 28px; font: 400 132px/0.8 'Jersey 15', monospace; letter-spacing: 0.02em; text-transform: uppercase; }
      p { margin-top: 40px; max-width: 900px; font-size: 40px; line-height: 1.3; color: #c9cac3; }
      .row { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; }
      .swatches { display: flex; gap: 14px; }
      .swatches i { width: 58px; height: 70px; }
      .url { font: 400 44px/1 'Jersey 15', monospace; letter-spacing: 0.04em; text-transform: uppercase; color: #a3a69f; }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg width="96" height="96" viewBox="0 0 20 20" shape-rendering="crispEdges">
        <path fill="#e8e6df" d="M7 0h6v6h-6zM0 7h6v6h-6zM14 7h6v6h-6zM7 14h6v6h-6z" />
        <rect x="7" y="7" width="6" height="6" fill="#d95cd9" />
      </svg>
      CTE2 Database
    </div>
    <p>Gear planner, affixes, uniques, runes, gems and stats for Craft to Exile 2.</p>
    <div class="row">
      <div class="swatches">
        <i style="background: #aaaaaa"></i><i style="background: #55ff55"></i><i style="background: #55ffff"></i>
        <i style="background: #ff55ff"></i><i style="background: #ffaa00"></i><i style="background: #aa00aa"></i>
      </div>
      <div class="url">cte2.seria.moe</div>
    </div>
  </body>
</html>
